name: One-time VDS audit and TiDB rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_REHEARSAL"
        required: true
        default: "RUN_REHEARSAL"
      managed_dump_vds_path:
        description: "Absolute non-web VDS path of the encrypted managed TiDB .gpg bundle"
        required: true
        default: "/var/backups/sherkozu/sherkozu-managed-tidb-2026-09-07.tar.gz.gpg"
      managed_dump_sha256:
        description: "SHA-256 of the encrypted .gpg file"
        required: true
      expected_table_count:
        description: "Expected table count in the dump manifest"
        required: true
        default: "96"
      expected_cloudfront_occurrences:
        description: "Expected DB-linked CloudFront URL occurrences"
        required: true
        default: "29"

permissions:
  contents: read

concurrency:
  group: one-time-migration-rehearsal
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  OUTPUT_DIR: rehearsal-output
  EXPECTED_TABLE_COUNT: ${{ inputs.expected_table_count }}
  EXPECTED_CLOUDFRONT_OCCURRENCES: ${{ inputs.expected_cloudfront_occurrences }}
  MANAGED_DUMP_VDS_PATH: ${{ inputs.managed_dump_vds_path }}
  MANAGED_DUMP_SHA256: ${{ inputs.managed_dump_sha256 }}
  SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
  REHEARSAL_DATABASE_URL: ${{ secrets.REHEARSAL_DATABASE_URL }}
  SSH_HOST: ${{ secrets.VDS_HOST }}
  SSH_USER: ${{ secrets.VDS_USER }}

jobs:
  audit-and-rehearse:
    if: inputs.confirm == 'RUN_REHEARSAL'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify required secrets and inputs
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_KEY }}
          MANAGED_DUMP_PASSPHRASE: ${{ secrets.MANAGED_DUMP_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=0
          for name in SOURCE_DATABASE_URL REHEARSAL_DATABASE_URL SSH_HOST SSH_USER SSH_PRIVATE_KEY MANAGED_DUMP_PASSPHRASE MANAGED_DUMP_VDS_PATH MANAGED_DUMP_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required workflow input or GitHub Secret: ${name}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          case "$MANAGED_DUMP_VDS_PATH" in
            /var/backups/sherkozu/*) ;;
            *) echo "managed_dump_vds_path must be under /var/backups/sherkozu"; exit 1 ;;
          esac
          [[ "$MANAGED_DUMP_VDS_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "managed_dump_vds_path contains unsupported characters"; exit 1; }
          [[ "$MANAGED_DUMP_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "managed_dump_sha256 must be 64 hex characters"; exit 1; }
          [[ "$EXPECTED_TABLE_COUNT" =~ ^[1-9][0-9]*$ ]] || { echo "expected_table_count must be positive"; exit 1; }
          [[ "$EXPECTED_CLOUDFRONT_OCCURRENCES" =~ ^[1-9][0-9]*$ ]] || { echo "expected_cloudfront_occurrences must be positive"; exit 1; }
          printf '%s' "$MANAGED_DUMP_PASSPHRASE" > "$RUNNER_TEMP/managed-dump-passphrase"
          chmod 600 "$RUNNER_TEMP/managed-dump-passphrase"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository migration metadata
        run: |
          pnpm exec drizzle-kit check
          node scripts/ci/run-managed-tidb-rehearsal.mjs --self-test
          node scripts/ci/archive-cloudfront-assets.mjs --self-test
          bash -n scripts/ci/run-vds-readonly-audit.sh

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/rehearsal_audit_key
          chmod 600 ~/.ssh/rehearsal_audit_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy, verify and decrypt managed dump from VDS
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR/private/dump"
          chmod 700 "$OUTPUT_DIR/private" "$OUTPUT_DIR/private/dump"
          copy_started=$(date +%s%3N)
          scp -i ~/.ssh/rehearsal_audit_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST:$MANAGED_DUMP_VDS_PATH" "$OUTPUT_DIR/private/managed-dump.tar.gz.gpg"
          copy_finished=$(date +%s%3N)
          actual_sha=$(sha256sum "$OUTPUT_DIR/private/managed-dump.tar.gz.gpg" | awk '{print $1}')
          [ "$actual_sha" = "$MANAGED_DUMP_SHA256" ] || { echo "Encrypted dump SHA-256 mismatch"; exit 1; }
          decrypt_started=$(date +%s%3N)
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/managed-dump-passphrase" --decrypt --output "$OUTPUT_DIR/private/managed-dump.tar.gz" "$OUTPUT_DIR/private/managed-dump.tar.gz.gpg"
          tar -C "$OUTPUT_DIR/private/dump" -xzf "$OUTPUT_DIR/private/managed-dump.tar.gz"
          (cd "$OUTPUT_DIR/private/dump" && sha256sum -c SHA256SUMS)
          decrypt_finished=$(date +%s%3N)
          COPY_MS=$((copy_finished-copy_started)) DECRYPT_EXTRACT_VERIFY_MS=$((decrypt_finished-decrypt_started)) node --input-type=module <<'NODE' > "$OUTPUT_DIR/dump-delivery-summary.json"
          console.log(JSON.stringify({
            copyFromVdsMs: Number(process.env.COPY_MS),
            decryptExtractVerifyMs: Number(process.env.DECRYPT_EXTRACT_VERIFY_MS),
            encryptedSha256Verified: true,
            internalChecksumsVerified: true,
            vdsMutations: 0,
          }, null, 2));
          NODE

      - name: Run read-only VDS audit and copy uploads
        run: bash scripts/ci/run-vds-readonly-audit.sh

      - name: Encrypt VDS audit and uploads artifacts
        run: |
          set -euo pipefail
          tar -C "$OUTPUT_DIR/vds-private" -czf "$OUTPUT_DIR/vds-audit.tar.gz" .
          gpg --symmetric --cipher-algo AES256 --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/managed-dump-passphrase" --output "$OUTPUT_DIR/vds-audit.tar.gz.gpg" "$OUTPUT_DIR/vds-audit.tar.gz"
          gpg --symmetric --cipher-algo AES256 --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/managed-dump-passphrase" --output "$OUTPUT_DIR/vds-uploads.tar.gz.gpg" "$OUTPUT_DIR/vds-uploads.tar.gz"
          sha256sum "$OUTPUT_DIR/vds-audit.tar.gz.gpg" "$OUTPUT_DIR/vds-uploads.tar.gz.gpg" > "$OUTPUT_DIR/vds-encrypted-artifacts.sha256"
          rm -rf "$OUTPUT_DIR/vds-private" "$OUTPUT_DIR/vds-audit.tar.gz" "$OUTPUT_DIR/vds-uploads.tar.gz"

      - name: Upload encrypted VDS audit and uploads
        uses: actions/upload-artifact@v4
        with:
          name: vds-readonly-audit-encrypted
          path: |
            rehearsal-output/vds-audit.tar.gz.gpg
            rehearsal-output/vds-uploads.tar.gz.gpg
            rehearsal-output/vds-audit-summary.json
            rehearsal-output/vds-encrypted-artifacts.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Import dump and run TiDB rehearsal
        env:
          MANAGED_DUMP_SQL: rehearsal-output/private/dump/managed-tidb-full.sql
          MANAGED_DUMP_MANIFEST: rehearsal-output/private/dump/dump-manifest.json
        run: node scripts/ci/run-managed-tidb-rehearsal.mjs

      - name: Download CloudFront assets and prepare replacement SQL
        env:
          DATABASE_URL: ${{ secrets.REHEARSAL_DATABASE_URL }}
        run: node scripts/ci/archive-cloudfront-assets.mjs

      - name: Encrypt CloudFront assets and replacement SQL
        run: |
          set -euo pipefail
          tar -C "$OUTPUT_DIR/cloudfront-private" -czf "$OUTPUT_DIR/cloudfront-assets.tar.gz" .
          gpg --symmetric --cipher-algo AES256 --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/managed-dump-passphrase" --output "$OUTPUT_DIR/cloudfront-assets.tar.gz.gpg" "$OUTPUT_DIR/cloudfront-assets.tar.gz"
          sha256sum "$OUTPUT_DIR/cloudfront-assets.tar.gz.gpg" > "$OUTPUT_DIR/cloudfront-encrypted-artifact.sha256"
          rm -rf "$OUTPUT_DIR/cloudfront-private" "$OUTPUT_DIR/cloudfront-assets.tar.gz"

      - name: Upload safe rehearsal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-rehearsal-results
          path: |
            rehearsal-output/rehearsal-result.json
            rehearsal-output/row-diff.json
            rehearsal-output/migration-output.log
            rehearsal-output/drizzle-check-output.log
            rehearsal-output/cloudfront-assets-summary.json
            rehearsal-output/vds-audit-summary.json
            rehearsal-output/dump-delivery-summary.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload encrypted CloudFront assets
        uses: actions/upload-artifact@v4
        with:
          name: cloudfront-assets-encrypted
          path: |
            rehearsal-output/cloudfront-assets.tar.gz.gpg
            rehearsal-output/cloudfront-encrypted-artifact.sha256
            rehearsal-output/cloudfront-assets-summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup plaintext and credentials
        if: always()
        run: |
          rm -f ~/.ssh/rehearsal_audit_key "$RUNNER_TEMP/managed-dump-passphrase"
          rm -rf rehearsal-output/private rehearsal-output/cloudfront-private rehearsal-output/vds-private
          rm -f rehearsal-output/*.sql rehearsal-output/*.tar.gz
