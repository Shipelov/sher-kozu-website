name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to rollback to (e.g. abc1234)"
        required: true
        type: string
      confirm:
        description: "Type ROLLBACK to confirm"
        required: true
        type: string

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: /var/www/sherkozu/current

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'ROLLBACK'

    steps:
      - name: Validate input
        run: |
          echo "Rolling back to commit: ${{ github.event.inputs.commit_sha }}"
          if [ -z "${{ github.event.inputs.commit_sha }}" ]; then
            echo "Error: commit_sha is required"
            exit 1
          fi

      - name: Checkout target commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Verify build
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build successful for commit ${{ github.event.inputs.commit_sha }}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup current version
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} "bash -s" << 'BACKUP_SCRIPT'
          cd /var/www/sherkozu/current
          CURRENT_VERSION=$(cat .deploy_version 2>/dev/null || echo "unknown")
          echo "Current deployed version: $CURRENT_VERSION"
          cp -r dist dist.backup.$(date +%Y%m%d_%H%M%S)
          echo "Backup created"
          BACKUP_SCRIPT

      - name: Deploy rollback dist to VDS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:${{ env.DEPLOY_PATH }}/dist/

      - name: Restart application
        env:
          GATE_ON: ${{ secrets.GATE_ENABLED }}
          GATE_L: ${{ secrets.GATE_LOGIN }}
          GATE_P: ${{ secrets.GATE_PASSWORD }}
          ROLLBACK_SHA: ${{ github.event.inputs.commit_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} "bash -s" << DEPLOY_SCRIPT
          cd /var/www/sherkozu/current

          echo "ROLLBACK:${ROLLBACK_SHA}" > .deploy_version

          pm2 stop sherkozu 2>/dev/null || true
          pm2 delete sherkozu 2>/dev/null || true
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 2
          pm2 start ecosystem.config.cjs
          pm2 save
          sleep 5

          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ --max-time 10 || echo "000")
          if [ "\$HTTP_CODE" = "200" ] || [ "\$HTTP_CODE" = "302" ]; then
            echo "ROLLBACK SUCCESS - Server healthy (HTTP \$HTTP_CODE)"
            echo "Rolled back to: ${ROLLBACK_SHA}"
          else
            echo "ROLLBACK FAILED - Server returned HTTP \$HTTP_CODE"
            pm2 status
            pm2 logs sherkozu --lines 20 --nostream
            exit 1
          fi
          pm2 status
          DEPLOY_SCRIPT

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
