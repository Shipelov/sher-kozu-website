name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: /var/www/sherkozu/current

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Verify build
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build successful"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist to VDS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:${{ env.DEPLOY_PATH }}/dist/

      - name: Write .env and restart
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} 'bash -s' << 'DEPLOY_SCRIPT'
          cd /var/www/sherkozu/current

          cat > .env << 'ENVEOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NODE_ENV=production
          PORT=3000
          VITE_APP_TITLE=Шерь Козу
          VITE_APP_ID=sherkozu
          OWNER_OPEN_ID=${{ secrets.OWNER_OPEN_ID }}
          OWNER_NAME=${{ secrets.OWNER_NAME }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_API_PROXY_URL=${{ secrets.TELEGRAM_API_PROXY_URL }}
          BITRIX24_BASE_URL=${{ secrets.BITRIX24_BASE_URL }}
          BITRIX24_REST_USER_ID=1
          BITRIX24_WEBHOOK_TOKEN=${{ secrets.BITRIX24_WEBHOOK_TOKEN }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL=${{ secrets.OPENAI_API_URL }}
          BUILT_IN_FORGE_API_URL=${{ secrets.OPENAI_API_URL }}
          BUILT_IN_FORGE_API_KEY=${{ secrets.OPENAI_API_KEY }}
          VITE_FRONTEND_FORGE_API_KEY=
          VITE_FRONTEND_FORGE_API_URL=
          OAUTH_SERVER_URL=https://koza.vip
          VITE_OAUTH_PORTAL_URL=https://koza.vip/login
          S3_ENDPOINT=
          S3_REGION=ru-central1
          S3_BUCKET=
          S3_ACCESS_KEY_ID=
          S3_SECRET_ACCESS_KEY=
          GOOGLE_MAPS_API_KEY=
          VITE_GOOGLE_MAPS_API_KEY=
          LOCAL_UPLOADS_DIR=/var/www/sherkozu/uploads
          BASE_URL=https://koza.vip
          VITE_YANDEX_MAPS_API_KE
