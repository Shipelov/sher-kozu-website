name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: /var/www/sherkozu/current

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Verify build
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build successful"
          ls -lh dist/
          du -sh dist/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VDS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:${{ env.DEPLOY_PATH }}/dist/

      - name: Update config and restart
        env:
          GATE_ENABLED: ${{ secrets.GATE_ENABLED }}
          GATE_LOGIN: ${{ secrets.GATE_LOGIN }}
          GATE_PASSWORD: ${{ secrets.GATE_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} 'bash -s' << DEPLOY_SCRIPT
          cd /var/www/sherkozu/current

          # Write ecosystem.config.cjs with current secrets
          cat > ecosystem.config.cjs << 'ECOEOF'
          module.exports = {
            apps: [{
              name: "sherkozu",
              script: "dist/index.js",
              cwd: "/var/www/sherkozu/current",
              instances: 1,
              exec_mode: "fork",
              env: {
                GATE_ENABLED: "${GATE_ENABLED}",
                GATE_LOGIN: "${GATE_LOGIN}",
                GATE_PASSWORD: "${GATE_PASSWORD}",
                NODE_ENV: "production",
                PORT: 3000,
                BITRIX24_OUTBOUND_WEBHOOK_TOKEN: "v1o6pwyb478h4cn8d0ov2ln5b2pxia8f"
              },
              max_memory_restart: "512M",
              log_date_format: "YYYY-MM-DD HH:mm:ss Z",
              error_file: "/var/www/sherkozu/shared/logs/pm2-error.log",
              out_file: "/var/www/sherkozu/shared/logs/pm2-out.log",
              merge_logs: true,
              restart_delay: 3000,
              max_restarts: 10,
              min_uptime: "10s"
            }]
          };
          ECOEOF

          pm2 stop sherkozu 2>/dev/null || true
          pm2 delete sherkozu 2>/dev/null || true
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 2
          pm2 start ecosystem.config.cjs
          pm2 save
          sleep 5

          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ --max-time 10 || echo "000" )
          if [ "\$HTTP_CODE" = "200" ] || [ "\$HTTP_CODE" = "302" ]; then
            echo "Server is healthy (HTTP \$HTTP_CODE)"
          else
            echo "Server returned HTTP \$HTTP_CODE"
            pm2 status
            pm2 logs sherkozu --lines 20 --nostream
            exit 1
          fi
          pm2 status
          DEPLOY_SCRIPT

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
