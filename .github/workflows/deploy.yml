name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: /var/www/sherkozu/current

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:push


      - name: Verify build
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          echo "Build successful"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VDS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VDS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist to VDS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:${{ env.DEPLOY_PATH }}/dist/

      - name: Write env and restart
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          JWT: ${{ secrets.JWT_SECRET }}
          OWNER_ID: ${{ secrets.OWNER_OPEN_ID }}
          OWNER: ${{ secrets.OWNER_NAME }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TG_PROXY: ${{ secrets.TELEGRAM_API_PROXY_URL }}
          B24_URL: ${{ secrets.BITRIX24_BASE_URL }}
          B24_TOKEN: ${{ secrets.BITRIX24_WEBHOOK_TOKEN }}
          OAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          OAI_URL: ${{ secrets.OPENAI_API_URL }}
          YA_MAPS: ${{ secrets.VITE_YANDEX_MAPS_API_KEY }}
          GATE_ON: ${{ secrets.GATE_ENABLED }}
          GATE_L: ${{ secrets.GATE_LOGIN }}
          GATE_P: ${{ secrets.GATE_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} "bash -s" << DEPLOY_SCRIPT
          cd /var/www/sherkozu/current

          cat > .env << 'INNEREOF'
          DATABASE_URL=${DB_URL}
          JWT_SECRET=${JWT}
          NODE_ENV=production
          PORT=3000
          VITE_APP_TITLE=Шерь Козу
          VITE_APP_ID=sherkozu
          OWNER_OPEN_ID=${OWNER_ID}
          OWNER_NAME=${OWNER}
          TELEGRAM_BOT_TOKEN=${TG_TOKEN}
          TELEGRAM_ADMIN_CHAT_ID=${TG_CHAT}
          TELEGRAM_API_PROXY_URL=${TG_PROXY}
          BITRIX24_BASE_URL=${B24_URL}
          BITRIX24_REST_USER_ID=1
          BITRIX24_WEBHOOK_TOKEN=${B24_TOKEN}
          OPENAI_API_KEY=${OAI_KEY}
          OPENAI_API_URL=${OAI_URL}
          BUILT_IN_FORGE_API_URL=${OAI_URL}
          BUILT_IN_FORGE_API_KEY=${OAI_KEY}
          VITE_FRONTEND_FORGE_API_KEY=
          VITE_FRONTEND_FORGE_API_URL=
          OAUTH_SERVER_URL=https://koza.vip
          VITE_OAUTH_PORTAL_URL=https://koza.vip/login
          S3_ENDPOINT=
          S3_REGION=ru-central1
          S3_BUCKET=
          S3_ACCESS_KEY_ID=
          S3_SECRET_ACCESS_KEY=
          GOOGLE_MAPS_API_KEY=
          VITE_GOOGLE_MAPS_API_KEY=
          LOCAL_UPLOADS_DIR=/var/www/sherkozu/uploads
          BASE_URL=https://koza.vip
          VITE_YANDEX_MAPS_API_KEY=${YA_MAPS}
          GATE_ENABLED=${GATE_ON}
          GATE_LOGIN=${GATE_L}
          GATE_PASSWORD=${GATE_P}
          INNEREOF
          sed -i 's/^          //' .env

          cat > ecosystem.config.cjs << 'ECOEOF'
          module.exports = {
            apps: [{
              name: "sherkozu",
              script: "dist/index.js",
              cwd: "/var/www/sherkozu/current",
              instances: 1,
              exec_mode: "fork",
              env: {
                GATE_ENABLED: "${GATE_ON}",
                GATE_LOGIN: "${GATE_L}",
                GATE_PASSWORD: "${GATE_P}",
                NODE_ENV: "production",
                PORT: 3000,
                BITRIX24_OUTBOUND_WEBHOOK_TOKEN: "v1o6pwyb478h4cn8d0ov2ln5b2pxia8f"
              },
              max_memory_restart: "512M",
              log_date_format: "YYYY-MM-DD HH:mm:ss Z",
              error_file: "/var/www/sherkozu/shared/logs/pm2-error.log",
              out_file: "/var/www/sherkozu/shared/logs/pm2-out.log",
              merge_logs: true,
              restart_delay: 3000,
              max_restarts: 10,
              min_uptime: "10s"
            }]
          };
          ECOEOF
          sed -i 's/^          //' ecosystem.config.cjs

          echo "${COMMIT_SHA}" > .deploy_version

          pm2 stop sherkozu 2>/dev/null || true
          pm2 delete sherkozu 2>/dev/null || true
          fuser -k 3000/tcp 2>/dev/null || true
          sleep 2
          pm2 start ecosystem.config.cjs
          pm2 save
          sleep 5

          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ --max-time 10 || echo "000")
          if [ "\$HTTP_CODE" = "200" ] || [ "\$HTTP_CODE" = "302" ]; then
            echo "Server is healthy (HTTP \$HTTP_CODE)"
            echo "Deployed commit: ${COMMIT_SHA}"
          else
            echo "Server returned HTTP \$HTTP_CODE"
            pm2 status
            pm2 logs sherkozu --lines 20 --nostream
            exit 1
          fi
          pm2 status
          DEPLOY_SCRIPT

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
